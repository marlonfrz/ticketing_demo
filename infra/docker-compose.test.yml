services:
  backend-test:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../ticketing-backend:/app
    command: >-
      sh -c "pip install --no-cache-dir -r requirements-dev.txt &&
      alembic upgrade head &&
      alembic check &&
      pytest -q"
    environment:
      APP_ENV: test
      SECRET_KEY: test-secret-key-with-at-least-32-characters
      DATABASE_URL: postgresql://ticketing:ticketing@postgres:5432/ticketing
      TEST_DATABASE_URL: postgresql://ticketing:ticketing@postgres:5432/ticketing_test
      REDIS_URL: ""
      RATE_LIMIT_ENABLED: "false"
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_USERNAME: test
      SMTP_PASSWORD: test
      SMTP_FROM_EMAIL: test@example.invalid
      EMAIL_DELIVERY_ENABLED: "false"
      FRONTEND_BASE_URL: http://127.0.0.1:5173
      BACKEND_BASE_URL: http://127.0.0.1:8000
      CORS_ALLOW_ORIGINS: http://127.0.0.1:5173
      OBJECT_STORAGE_BACKEND: local
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ticketing
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 2s
      timeout: 3s
      retries: 15
