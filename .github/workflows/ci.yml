name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ticketing
          POSTGRES_USER: ticketing
          POSTGRES_PASSWORD: ticketing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketing -d ticketing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      SECRET_KEY: ci-secret-key-with-at-least-32-characters
      DATABASE_URL: postgresql://ticketing:ticketing@127.0.0.1:5432/ticketing
      TEST_DATABASE_URL: postgresql://ticketing:ticketing@127.0.0.1:5432/ticketing_test
      REDIS_URL: ""
      RATE_LIMIT_ENABLED: "false"
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_USERNAME: ci
      SMTP_PASSWORD: ci
      SMTP_FROM_EMAIL: ci@example.invalid
      EMAIL_DELIVERY_ENABLED: "false"
      FRONTEND_BASE_URL: http://127.0.0.1:5173
      BACKEND_BASE_URL: http://127.0.0.1:8000
      CORS_ALLOW_ORIGINS: http://127.0.0.1:5173
      BACKEND_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_SUPPORT_EMAIL: soporte@example.invalid

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ticketing-backend/requirements.txt
            ticketing-backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: ticketing-backend
        run: pip install -r requirements-dev.txt

      - name: Verify public repository boundaries
        run: python scripts/check_public_repository.py

      - name: Verify migrations
        working-directory: ticketing-backend
        run: |
          alembic upgrade head
          alembic check

      - name: Run backend tests
        working-directory: ticketing-backend
        run: pytest -q

      - name: Start API for contract generation
        working-directory: ticketing-backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/ticketing-api.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/health/ready && exit 0
            sleep 1
          done
          cat /tmp/ticketing-api.log
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ticketing-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ticketing-frontend
        run: npm ci

      - name: Verify generated API contract
        working-directory: ticketing-frontend
        run: |
          npm run generate:api-types
          git diff --exit-code -- src/types/api.generated.ts

      - name: Verify frontend
        working-directory: ticketing-frontend
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
